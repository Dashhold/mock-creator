server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Documents are uploaded through this proxy, so the default 1 MB body limit
    # would reject almost every real PDF.
    client_max_body_size 256m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Shared proxy settings for the API.
    location /api/ {
        # Addressed by compose service name so the container can be renamed or
        # replaced without editing this file.
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a large upload to finish streaming through. Conversion
        # itself runs as a background job, so no request waits on OCR.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_request_buffering off;
    }

    # The API's own liveness endpoint sits at the root, not under /api.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    # Hashed assets can be cached hard; everything else must not be.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
