# The frontend's web server: serves the built app and forwards /api/ to the API.
#
# This file is a template. When the container starts, the nginx image's
# entrypoint renders it to /etc/nginx/conf.d/default.conf, substituting the PORT
# and API_UPSTREAM environment variables; nginx's own variables are left alone.
# The files included from /etc/nginx/mock-creator/ are written just before nginx
# starts, by docker-entrypoint.d/40-mock-creator.sh.
#
# The defaults (port 80, the API at api:8080) suit docker compose. On Railway,
# PORT comes from the platform and API_UPSTREAM is the API's private address.
server {
    listen ${PORT};
    # The same port on IPv6, where the container has IPv6.
    include /etc/nginx/mock-creator/listen-ipv6.conf;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # A login for the whole app when BASIC_AUTH_USER and BASIC_AUTH_PASSWORD are
    # set. Empty otherwise.
    include /etc/nginx/mock-creator/auth.conf;

    # Documents are uploaded through this proxy, so the default 1 MB body limit
    # would reject almost every real PDF.
    client_max_body_size 256m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # The API's address is looked up when a request needs it, not once at
    # startup. nginx then starts even while the API is still deploying, and
    # follows it when a redeploy gives it a new address.
    include /etc/nginx/mock-creator/resolver.conf;
    set $api_upstream ${API_UPSTREAM};

    # Shared proxy settings for the API.
    location /api/ {
        # No path after the address: the request's own /api/... path is passed
        # through unchanged, which is what the API serves.
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API's shared secret when API_KEY is set, added here so it never
        # reaches the browser. Empty otherwise, and a key the browser sends
        # itself is then passed through as before.
        include /etc/nginx/mock-creator/api-key.conf;

        # Long enough for a large upload to finish streaming through. Conversion
        # itself runs as a background job, so no request waits on OCR.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_request_buffering off;
    }

    # The API's own liveness endpoint sits at the root, not under /api.
    location = /health {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # This web server's own liveness, for deploy healthchecks. It stays open when
    # a login is required, so a healthcheck is never refused with a 401.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets can be cached hard; everything else must not be.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
